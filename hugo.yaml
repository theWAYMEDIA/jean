    - name: 'Home'
      url: '/'
      weight: 10
    - name: 'About'
      url: '/about/'
      weight: 15
    - name: 'Memories'
      url: '/memories/'
      weight: 20
    - name: 'Posts'
      url: '/posts/'
      weight: 30
