baseURL: 'https://jeanduplessis.net/'
languageCode: 'en'
title: 'Jean Prieur du Plessis'

params:
  description: "Jean Prieur du Plessis — author and teacher in the Wayist tradition."
  tagline: "Author / Teacher"
  contact:
    - label: 'Wayist.Life'
      text: '@jeanduplessis'
      url: 'https://wayist.life'
    - label: 'X'
      text: '@wayistcoach'
      url: 'https://x.com/wayistcoach'
    - label: 'Amazon'
      text: 'Author page'
      url: 'https://www.amazon.com/stores/Jean-Prieur-du-Plessis/author/B0DH4BLB7G'

